name: Hermit Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermit-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Desktop dependency composition
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Product Desktop only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0

      - name: Use qualified Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Desktop checks
        run: corepack pnpm test
