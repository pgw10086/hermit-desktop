name: Platform lock

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  product-desktop-only:
    name: Product Desktop only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Product Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0

      - name: Use qualified Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Verify source-independent platform inputs
        run: node scripts/platform-lock.mjs prepare --mode release

      - name: Frozen install without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify platform lock gates
        run: |
          corepack pnpm run test:platform-lock
          corepack pnpm run test:package-product

      - name: Verify Product Desktop dependency contract
        run: |
          corepack pnpm run verify:peers
          corepack pnpm --filter @hermit/desktop typecheck

      - name: Verify Product Plugin projection
        run: node scripts/verify-plugin-manifests.mjs

      - name: Refuse generated repository changes
        run: git diff --exit-code
