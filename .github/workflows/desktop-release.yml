name: Hermit Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: hermit-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: macOS arm64
            runner: macos-14
            package_script: dist:desktop:mac
            asset_script: scripts/prepare-macos-release-assets.mjs
            asset_directory: .hermit/artifacts/releases/${{ github.ref_name }}
            artifact_name: hermit-release-macos
          - display_name: Windows x64
            runner: windows-2022
            package_script: dist:desktop:win
            asset_script: scripts/prepare-windows-release-assets.mjs
            asset_directory: .hermit/artifacts/releases/${{ github.ref_name }}
            artifact_name: hermit-release-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout Product Desktop only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0

      - name: Use qualified Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Verify release tag and version
        run: node scripts/verify-release-input.mjs

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Build unsigned installer
        run: corepack pnpm run ${{ matrix.package_script }}

      - name: Prepare release assets
        run: node ${{ matrix.asset_script }}

      - name: Upload platform release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: ${{ matrix.asset_directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish Desktop Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Use qualified Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download macOS assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermit-release-macos-${{ github.sha }}
          path: release-inputs/macos

      - name: Download Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermit-release-windows-${{ github.sha }}
          path: release-inputs/windows

      - name: Aggregate release assets
        run: |
          set -euo pipefail
          node scripts/aggregate-release-assets.mjs \
            --mac release-inputs/macos \
            --windows release-inputs/windows \
            --output release-assets

      - name: Stage, verify and publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-product-release.mjs publish release-assets
