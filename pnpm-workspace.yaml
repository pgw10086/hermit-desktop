packages:
  - apps/*
  - native/*
  - packages/*
engineStrict: true
linkWorkspacePackages: false
verifyDepsBeforeRun: error
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  electron: true
  electron-winstaller: false
  koffi: true
  node-pty: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@tianbuyv/agent-desktop-core@0.1.1'
  - '@tianbuyv/dsh-runtime-adapter@0.1.1'
  - '@tianbuyv/file-workspace@0.2.2'
  - '@tianbuyv/organizer@0.2.2'
  - '@tianbuyv/smart-clipboard@0.2.2'
